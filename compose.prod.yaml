# Production compose for a single server (for example an Oracle Cloud Always Free VM).
#
# Differences from compose.yaml:
#   - Only nginx (port 80) is reachable from outside. The master and the storage nodes stay on the
#     internal Docker network.
#   - The UI talks to the master through nginx under /api (same origin, so no CORS needed).
#   - Memory limits and JVM heap caps, so the whole cluster fits comfortably on one small server.
#
# Start:  docker compose -f compose.prod.yaml up -d --build
# Before the first start, create deploy/.htpasswd (see docs/deployment/oracle-cloud.md).

x-storage-node: &storage-node
  build:
    context: ./storage-node
  image: byteharvest-storage-node:latest
  restart: unless-stopped
  mem_limit: 448m

x-node-env: &node-env
  HEARTBEAT_MASTER_URL: http://master:8080/heartbeat
  STORAGE_BASE_DIR: /data
  JAVA_TOOL_OPTIONS: "-Xmx192m -XX:+UseSerialGC"

services:
  master:
    build:
      context: ./master-service
    image: byteharvest-master:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/metadata.db
      # Copies kept of every chunk. Must not exceed the number of nodes in STORAGE_NODES.
      STORAGE_REPLICATION_FACTOR: 2
      STORAGE_CHUNK_SIZE_BYTES: 1048576
      STORAGE_NODES: http://storage-node-1:5001,http://storage-node-2:5002,http://storage-node-3:5003,http://storage-node-4:5004,http://storage-node-5:5005
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:+UseSerialGC"
    expose:
      - "8080"
    volumes:
      - master-metadata:/data
    depends_on:
      - storage-node-1
      - storage-node-2
      - storage-node-3
      - storage-node-4
      - storage-node-5
    restart: unless-stopped
    mem_limit: 896m

  storage-node-1:
    <<: *storage-node
    environment:
      <<: *node-env
      SERVER_PORT: 5001
      STORAGE_NODE_URL: http://storage-node-1:5001
    volumes:
      - storage-node-1-data:/data
    expose:
      - "5001"

  storage-node-2:
    <<: *storage-node
    environment:
      <<: *node-env
      SERVER_PORT: 5002
      STORAGE_NODE_URL: http://storage-node-2:5002
    volumes:
      - storage-node-2-data:/data
    expose:
      - "5002"

  storage-node-3:
    <<: *storage-node
    environment:
      <<: *node-env
      SERVER_PORT: 5003
      STORAGE_NODE_URL: http://storage-node-3:5003
    volumes:
      - storage-node-3-data:/data
    expose:
      - "5003"

  storage-node-4:
    <<: *storage-node
    environment:
      <<: *node-env
      SERVER_PORT: 5004
      STORAGE_NODE_URL: http://storage-node-4:5004
    volumes:
      - storage-node-4-data:/data
    expose:
      - "5004"

  storage-node-5:
    <<: *storage-node
    environment:
      <<: *node-env
      SERVER_PORT: 5005
      STORAGE_NODE_URL: http://storage-node-5:5005
    volumes:
      - storage-node-5-data:/data
    expose:
      - "5005"

  client-ui:
    build:
      context: ./client-ui
      args:
        # Same origin: the browser calls /api/..., nginx forwards it to the master.
        VITE_API_BASE_URL: /api
    image: byteharvest-ui:latest
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - master
    restart: unless-stopped
    mem_limit: 64m

volumes:
  master-metadata:
  storage-node-1-data:
  storage-node-2-data:
  storage-node-3-data:
  storage-node-4-data:
  storage-node-5-data:
