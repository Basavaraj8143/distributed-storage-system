spring.application.name=master-service
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
storage.nodes=http://localhost:5001,http://localhost:5002,http://localhost:5003,http://localhost:5004,http://localhost:5005
logging.file.name=logs/master-service.log

# SQLite Database Settings
spring.datasource.url=jdbc:sqlite:metadata.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
