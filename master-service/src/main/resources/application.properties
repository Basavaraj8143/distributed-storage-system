spring.application.name=master-service
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
storage.nodes=${STORAGE_NODES:http://localhost:5001,http://localhost:5002,http://localhost:5003,http://localhost:5004,http://localhost:5005}

# Copies kept of every chunk. Must not exceed the number of nodes in storage.nodes.
# Raising it makes repair add the missing copies to existing chunks; lowering it does not remove extra copies.
storage.replication-factor=${STORAGE_REPLICATION_FACTOR:2}
# Size of one chunk in bytes (minimum 1024). Existing files keep the chunks they were stored with.
storage.chunk-size-bytes=${STORAGE_CHUNK_SIZE_BYTES:1048576}
# How nodes are chosen for new chunk copies. Only "random" exists today (also the default when unset).
# A new strategy registers itself under its own value; see docs/rebuild/placement-strategy.md.
# storage.placement-strategy=random

# Login for the user-facing API (HTTP Basic). There is no default password on purpose:
# the master will not start until APP_PASSWORD is set.
app.auth.username=${APP_USERNAME:admin}
app.auth.password=${APP_PASSWORD:}

# Secret shared with the storage nodes (X-Node-Token header). Must be the same value on the master and
# on every node. No default on purpose: the master will not start until NODE_TOKEN is set (16+ characters).
app.node.token=${NODE_TOKEN:}

# Optional Kafka feed (local learning feature, off by default; see docs/rebuild/kafka-events.md).
# When enabled, two activities are published to the topic below as JSON: FILE_UPLOADED and FILE_DELETED.
# Publishing is best effort: if the broker is down, the message is dropped with a warning and nothing else is affected.
kafka.enabled=${KAFKA_ENABLED:false}
kafka.topic.file-events=${KAFKA_FILE_EVENTS_TOPIC:byteharvest.file-events}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Never let a missing broker block a request for long.
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.admin.properties.request.timeout.ms=3000
spring.kafka.admin.properties.default.api.timeout.ms=3000

logging.file.name=logs/master-service.log

# Node liveness: STALE after no heartbeat for this long (no new uploads, replicas are kept)
heartbeat.stale-timeout-ms=${HEARTBEAT_STALE_TIMEOUT_MS:15000}
# FAILED after this long (replica records are dropped and chunks re-replicated). Must be larger than the stale timeout.
heartbeat.dead-timeout-ms=${HEARTBEAT_DEAD_TIMEOUT_MS:60000}

# SQLite Database Settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:metadata.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
