spring.application.name=master-service
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
storage.nodes=${STORAGE_NODES:http://localhost:5001,http://localhost:5002,http://localhost:5003,http://localhost:5004,http://localhost:5005}

# Copies kept of every chunk. Must not exceed the number of nodes in storage.nodes.
# Raising it makes repair add the missing copies to existing chunks; lowering it does not remove extra copies.
storage.replication-factor=${STORAGE_REPLICATION_FACTOR:2}
# Size of one chunk in bytes (minimum 1024). Existing files keep the chunks they were stored with.
storage.chunk-size-bytes=${STORAGE_CHUNK_SIZE_BYTES:1048576}
# How nodes are chosen for new chunk copies. Only "random" exists today (also the default when unset).
# A new strategy registers itself under its own value; see docs/rebuild/placement-strategy.md.
# storage.placement-strategy=random

logging.file.name=logs/master-service.log

# Node liveness: STALE after no heartbeat for this long (no new uploads, replicas are kept)
heartbeat.stale-timeout-ms=${HEARTBEAT_STALE_TIMEOUT_MS:15000}
# FAILED after this long (replica records are dropped and chunks re-replicated). Must be larger than the stale timeout.
heartbeat.dead-timeout-ms=${HEARTBEAT_DEAD_TIMEOUT_MS:60000}

# SQLite Database Settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:metadata.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
