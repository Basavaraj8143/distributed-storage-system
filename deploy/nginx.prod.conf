# nginx for the production deployment. Mounted over the image's default config by compose.prod.yaml.
# The local-development config (client-ui/nginx.conf) is not changed.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The master accepts uploads up to 10 MB. nginx's default limit is 1 MB, which would reject most uploads.
    client_max_body_size 12m;

    # Password for everything, because the master has no authentication of its own.
    # The file is created on the server (see docs/deployment/oracle-cloud.md) and is not in git.
    auth_basic "ByteHarvest";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Heartbeats come from the storage nodes over the internal Docker network and are never needed from outside.
    # An exact match wins over the /api/ block below.
    location = /api/heartbeat {
        return 404;
    }

    # /api/files -> master /files, /api/upload -> master /upload, and so on.
    # The trailing slash on proxy_pass removes the /api prefix.
    location /api/ {
        proxy_pass http://master:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The React app. Unknown paths (like /files on refresh) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
