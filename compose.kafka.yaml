# Optional local Kafka broker for learning. NOT used by compose.prod.yaml.
#
# Everything in Docker:
#   1. put  KAFKA_ENABLED=true  in .env
#   2. docker compose -f compose.yaml -f compose.kafka.yaml up --build
#
# Master from IntelliJ, only the broker in Docker:
#   docker compose -f compose.kafka.yaml up -d
#   then run the master with  KAFKA_ENABLED=true  (it connects to localhost:9092)
#
# Single node in KRaft mode (no ZooKeeper). Two listeners: kafka:19092 for containers on the compose
# network, localhost:9092 for programs on your own machine.
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: byteharvest-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    restart: unless-stopped
