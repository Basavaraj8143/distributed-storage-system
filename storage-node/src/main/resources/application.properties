spring.application.name=storage-node
heartbeat.master-url=${HEARTBEAT_MASTER_URL:http://localhost:8080/heartbeat}
# Leave empty for relative paths in current working directory.
# Example for WSL absolute path: /mnt/d/projects/final
storage.base-dir=${STORAGE_BASE_DIR:}

# Secret shared with the master. Must be the same value on the master and on every node.
# No default on purpose: the node will not start until NODE_TOKEN is set (at least 16 characters).
app.node.token=${NODE_TOKEN:}
